name: "Reifegrad melden"
description: "Dein Standort hat etwas gelernt? Hier melden — ohne Dateien zu bearbeiten. Das Kernteam gibt frei, die Karte aktualisiert sich automatisch."
title: "Reifegrad: "
labels: ["reifegrad-meldung"]
body:
  - type: markdown
    attributes:
      value: |
        **So funktioniert es:** Formular ausfüllen und absenden. Die Automatik prüft die Meldung und zeigt eine Vorschau als Kommentar. Sobald jemand aus dem Kernteam `/freigeben` kommentiert, wird die Reifegrad-Karte automatisch aktualisiert — niemand muss eine Datei anfassen.
  - type: dropdown
    id: awf
    attributes:
      label: "Anwendungsfall"
      options:
        - "a010 · Bestandserfassung und -modellierung"
        - "a020 · Bedarfsplanung"
        - "a030 · Planungsvarianten"
        - "a040 · Visualisierung"
        - "a050 · Koordination der Fachgewerke"
        - "a060 · Planungsfortschrittskontrolle und Qualitätsprüfung"
        - "a070 · Bemessung und Nachweisführung"
        - "a080 · Ableitung von Planunterlagen"
        - "a090 · Genehmigungsprozess"
        - "a100 · Mengen- und Kostenermittlung"
        - "a110 · Leistungsverzeichnis, Ausschreibung, Vergabe"
        - "a120 · Terminplanung der Ausführung"
        - "a130 · Logistikplanung"
        - "a140 · Baufortschrittskontrolle"
    validations:
      required: true
  - type: dropdown
    id: standort
    attributes:
      label: "Niederlassung"
      options:
        - "Hamburg"
        - "Hannover"
        - "Berlin"
        - "Magdeburg"
        - "Essen"
        - "Düsseldorf"
        - "Köln"
        - "Leipzig"
        - "Dresden"
        - "Chemnitz"
        - "Erfurt"
        - "Wiesbaden"
        - "Aschaffenburg"
        - "Kaiserslautern"
        - "Bexbach"
        - "Nürnberg"
        - "Karlsruhe"
        - "Stuttgart"
        - "Neu-Ulm"
        - "München"
    validations:
      required: true
  - type: dropdown
    id: stufe
    attributes:
      label: "Neue Stufe"
      description: "Stufen werden gemeinsam bestätigt: Der Standort schlägt vor, das Kernteam gibt frei (4·2·2)."
      options:
        - "1 · geplant — in einem Projekt vorgesehen, noch nicht umgesetzt"
        - "2 · Pilot — in einem Projekt erprobt, Erfahrungen liegen vor"
        - "3 · im Einsatz — in laufenden Projekten regelmäßig genutzt"
        - "4 · Standard / Vorreiter — etabliert, der Standort kann andere anleiten"
        - "0 · nicht begonnen — Eintrag zurücksetzen"
    validations:
      required: true
  - type: input
    id: person
    attributes:
      label: "Ansprechperson (optional)"
      description: "Nur der Name — erreichbar über das Firmenverzeichnis. Keine E-Mail-Adressen. Bitte nur mit Einverständnis der Person."
      placeholder: "Vorname Nachname — mehrere mit · trennen"
  - type: textarea
    id: hinweis
    attributes:
      label: "Hinweis / Begründung (optional)"
      description: "Keine Kunden- oder Projektnamen, keine personenbezogenen Daten — die Seite ist öffentlich erreichbar."
      placeholder: "Was wurde gelernt? Was können andere Standorte übernehmen?"
